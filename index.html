<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro Timer</title>
    <link rel="icon" type="image/x-icon" href="assets/icons8-pomodoro-50.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>Pomodoro Timer</h1>
        <p>
          25 min focus, 5 min short break, 30 min long break after 4 sessions.
        </p>
      </header>
      <main class="timer-card">
        <div class="mode-tabs" role="tablist" aria-label="Timer mode">
          <button
            class="tab active"
            role="tab"
            data-mode="focus"
            aria-selected="true">
            Focus
          </button>
          <button
            class="tab"
            role="tab"
            data-mode="shortBreak"
            aria-selected="false">
            Short Break
          </button>
          <button
            class="tab"
            role="tab"
            data-mode="longBreak"
            aria-selected="false">
            Long Break
          </button>
        </div>

        <div class="status">
          <p class="status-text" id="statusText">Ready to focus</p>
          <p class="session-count" id="sessionCount">
            Completed Focus Sessions: 0 / 4
          </p>
        </div>

        <div class="timer-visual">
          <svg class="progress-ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="progress-ring_track" cx="60" cy="60" r="52"></circle>
            <circle
              class="progress-ring_indicator"
              id="progressRingIndicator"
              cx="60"
              cy="60"
              r="52"></circle>
          </svg>
          <div class="time-display" id="timeDisplay" aria-live="polite">
            25:00
          </div>
        </div>

        <div class="control-btns">
          <button id="startPauseBtn" class="btn btn-primary">Start</button>
          <button id="resetBtn" class="btn btn-secondary">Reset</button>
          <button id="skipBtn" class="btn btn-secondary">Skip</button>
        </div>

        <div class="audio-control">
          <label for="volume">Set Alarm Volume</label>
          <input
            type="range"
            id="volume"
            min="0"
            max="1"
            value="0.5"
            step="0.05" />
        </div>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
